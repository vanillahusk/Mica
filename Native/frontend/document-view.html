<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="pdfjs/pdf_viewer.css"><link rel="stylesheet" href="document-view.css"><link rel="stylesheet" href="document-find.css"></head><body>
<nav hidden id="pdf-tools"><button id="prev" title="上一页">←</button><label><input id="page" type="number" min="1" value="1" aria-label="页码"> / <span id="total">0</span></label><button id="next" title="下一页">→</button><button id="smaller" title="缩小">−</button><output id="scale">100%</output><button id="larger" title="放大">＋</button><button id="fit">适应宽度</button></nav>
<section id="doc-find-bar" hidden aria-label="文内查找"><input id="doc-find-input" type="search" maxlength="200" placeholder="查找本文内容"><button data-find="prev" title="上一处">↑</button><button data-find="next" title="下一处">↓</button><button data-find="close" title="关闭">×</button></section>
<div id="error" role="status"></div><div id="viewport"><div id="sheet" class="pdfViewer"></div><pre id="plain" hidden></pre></div>
<script type="module" src="continuous-view.js"></script></body></html>
